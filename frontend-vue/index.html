<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配：viewport-fit=cover 让 iPhone 刘海屏可安全铺满（配合 safe-area 留白）；
         刻意不写 maximum-scale / user-scalable —— 允许双指缩放是无障碍要求 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="跟着音频做精听与听写的英语学习网站" />
    <!-- 站点图标（柚子龙吉祥物）：ICO 兜底 + PNG 按尺寸适配，iOS 桌面用 apple-touch-icon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FayeLong 英语学习</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
