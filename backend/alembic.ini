# =============================================================================
# Alembic configuration -- FayeLong backend DB migrations (introduced in P3-1)
# =============================================================================
# NOTE: this file is deliberately PURE ASCII (English comments only).
# alembic reads alembic.ini with the *locale* encoding (alembic/util/compat.py
# -> `read_config_parser(..., encoding="locale")`), which is cp936/GBK on a
# Chinese Windows box. Non-ASCII comments (e.g. UTF-8 Chinese) therefore raise
# UnicodeDecodeError before a single migration runs. Chinese explanations live
# in migrations/env.py (a Python file, always read as UTF-8).
#
# Common commands (run inside backend/ with the project venv):
#
#   upgrade to latest :  .venv/Scripts/python.exe -m alembic upgrade head
#   show current rev  :  .venv/Scripts/python.exe -m alembic current
#   roll back to empty:  .venv/Scripts/python.exe -m alembic downgrade base
#   show history      :  .venv/Scripts/python.exe -m alembic history --verbose
#
# TARGET DATABASE
#   Default target is app.core.config.DB_PATH (i.e. <repo>/data/app.db).
#   To operate on ANOTHER database (e.g. a copy of the real one) override it
#   via a command-line property:
#
#     .venv/Scripts/python.exe -m alembic -x db_path=D:/tmp/copy.db upgrade head
#
#   NEVER run `upgrade` against data/app.db directly: copy it first and
#   rehearse on the copy. See migrations/env.py for the resolution order.
#
# NO HARD-CODED sqlalchemy.url
#   The URL is injected by migrations/env.py (from `-x db_path=` or
#   app.core.config.DB_PATH). If you ever must put a value here, remember that
#   '%' is the ini interpolation character -- escape it as '%%'.
#
# NO LOGGING CONFIGURATION INSIDE PYTEST
#   Migrations also run in-process (pytest calls alembic.command programmatically).
#   logging.config.fileConfig() clears the root handlers, which would hijack the
#   host logging setup (pytest caplog, app.core.logging). env.py therefore calls
#   fileConfig() ONLY for real CLI invocations (it skips it when pytest is in
#   sys.modules). See `_configure_logging()` in migrations/env.py.
# =============================================================================

[alembic]
# Migration script root. %(here)s == directory of this ini (backend/), so this
# works regardless of the current working directory.
script_location = %(here)s/migrations

# Make the `app` package importable when running from backend/.
prepend_sys_path = .

# Separator used for multi-value path options: "os" means os.pathsep
# (';' on Windows, ':' on POSIX). SQLAlchemy URLs contain ':', so "os" avoids
# ambiguity.
path_separator = os

# Filename template for newly generated revision files. The baseline is named
# manually (0001_baseline.py); this only affects `alembic revision`.
file_template = %%(rev)s_%%(slug)s

# Intentionally EMPTY: the real URL is injected by migrations/env.py.
sqlalchemy.url =


# -----------------------------------------------------------------------------
# Logging: only used by real CLI runs (env.py skips fileConfig under pytest).
# Without this, `alembic upgrade head` prints NOTHING -- a silent migration is a
# trap (you cannot tell which database was touched, or whether it ran at all).
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# logging.config reads these with raw=True, so single '%' is correct here
# (no ini interpolation happens on formatter sections).
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
