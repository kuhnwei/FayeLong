', Consolas, 'SF Mono', monospace" fill="#C2410C" text-anchor="end" font-weight="700">636</text><text x="134" y="642.0" font-size="16" fill="#64748B" text-anchor="end">竖笔直线段</text><line x1="152.0" y1="936.0" x2="152.0" y2="1132.0" stroke="#C2410C" stroke-width="1.4"/><line x1="144.0" y1="936.0" x2="160.0" y2="936.0" stroke="#C2410C" stroke-width="1.4"/><line x1="144.0" y1="1132.0" x2="160.0" y2="1132.0" stroke="#C2410C" stroke-width="1.4"/><text x="134" y="1034.0" font-size="21" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#C2410C" text-anchor="end" font-weight="700">196</text><text x="134" y="1058.0" font-size="16" fill="#64748B" text-anchor="end">横笔厚</text><line x1="330.0" y1="170.0" x2="526.0" y2="170.0" stroke="#C2410C" stroke-width="1.4"/><line x1="330.0" y1="162.0" x2="330.0" y2="178.0" stroke="#C2410C" stroke-width="1.4"/><line x1="526.0" y1="162.0" x2="526.0" y2="178.0" stroke="#C2410C" stroke-width="1.4"/><text x="428" y="156.0" font-size="21" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#C2410C" text-anchor="middle" font-weight="700">SW = 196</text><text x="428" y="196.0" font-size="16" fill="#64748B" text-anchor="middle">笔宽 = H/φ³</text><text x="330" y="1260.0" font-size="24" font-weight="800" fill="#0F172A">★ 宽度尺寸链：三宽度被 φ 链必然分割（恒等式，非调参所得）</text><text x="330" y="1292.0" font-size="17" fill="#475569">W/φ　+　SW/φ　+　SW/φ²　=　H/φ²　+　H/φ⁴　+　H/φ⁵　=　H × 0.618034　=　W</text><line x1="330.0" y1="1336.0" x2="844.0" y2="1336.0" stroke="#C2410C" stroke-width="2"/><line x1="330.0" y1="1328.0" x2="330.0" y2="1344.0" stroke="#C2410C" stroke-width="2"/><line x1="844.0" y1="1328.0" x2="844.0" y2="1344.0" stroke="#C2410C" stroke-width="2"/><text x="587" y="1324.0" font-size="20" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#C2410C" text-anchor="middle" font-weight="700">W = 514</text><rect x="330.0" y="1388.0" width="318.0" height="44" fill="#0E3B34" fill-opacity="0.18" stroke="#0E3B34" stroke-width="2"/><rect x="648.0" y="1388.0" width="121.0" height="44" fill="#0E3B34" fill-opacity="0.18" stroke="#0E3B34" stroke-width="2"/><rect x="769.0" y="1388.0" width="75.0" height="44" fill="#D98A3D" fill-opacity="0.18" stroke="#D98A3D" stroke-width="2"/><text x="489" y="1466.0" font-size="20" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0E3B34" text-anchor="middle" font-weight="700">L_W = 318　( = W/φ )</text><line x1="708.5" y1="1432.0" x2="708.5" y2="1480.0" stroke="#C2410C" stroke-width="1"/><text x="660" y="1494.0" font-size="20" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0E3B34" font-weight="700">GAP = 121　( = SW/φ )</text><line x1="806.5" y1="1432.0" x2="806.5" y2="1508.0" stroke="#D98A3D" stroke-width="1.4"/><text x="660" y="1522.0" font-size="20" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#D98A3D" font-weight="700">DOT = 75　( = SW/φ² )</text><text x="330" y="1562.0" font-size="18" fill="#334155">318 + 121 + 75 = 514 ≡ 514　误差 0.000%　→　外框宽度没有自由度：定了 1:φ 与笔宽 H/φ³，三段宽度即被锁死</text><text x="330.0" y="1647" font-size="19" font-weight="800" fill="#0F172A">句点放样　DOT = 75</text><rect x="330.0" y="1677" width="75" height="75" fill="none" stroke="#D98A3D" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M456.71 757 H496.29 A17.71 17.71 0 0 1 514 774.71 V814.29 A17.71 17.71 0 0 1 496.29 832 H456.71 A17.71 17.71 0 0 1 439 814.29 V774.71 A17.71 17.71 0 0 1 456.71 757 Z" transform="translate(-109,920)" fill="#D98A3D"/><line x1="290.0" y1="1752.0" x2="555.0" y2="1752.0" stroke="#C2410C" stroke-width="1" stroke-dasharray="6 5"/><text x="435.0" y="1681" font-size="16.5" fill="#475569">微圆角 r = 17.71 = DOT/φ³（唯一软度出处）</text><text x="435.0" y="1707" font-size="16.5" fill="#475569">底边与横笔底边共线 → 落在同一条基线上</text><text x="435.0" y="1733" font-size="16.5" fill="#475569">打破正圆 → 规避「浅底＋中央实心圆」国旗联想</text><text x="435.0" y="1759" font-size="16.5" fill="#475569">右缘与外框右缘齐平 → 右侧闭合</text><text x="1030" y="210" font-size="24" fill="#0F172A" font-weight="800">① 比例系统 · 黄金比 φ = 1.618034</text><line x1="1030" y1="224" x2="1960" y2="224" stroke="#0F172A" stroke-width="2"/><text x="1030" y="254" font-size="17.5" fill="#334155">外框 W : H</text><text x="1320" y="254" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.61779</text><text x="1560" y="254" font-size="16" fill="#64748B">目标 0.618034｜误差 0.040%</text><text x="1030" y="281" font-size="17.5" fill="#334155">笔宽 SW : H</text><text x="1320" y="281" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.23558</text><text x="1560" y="281" font-size="16" fill="#64748B">目标 0.236068｜误差 0.208%</text><text x="1030" y="308" font-size="17.5" fill="#334155">L 宽 L_W : W</text><text x="1320" y="308" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.61868</text><text x="1560" y="308" font-size="16" fill="#64748B">目标 0.618034｜误差 0.104%</text><text x="1030" y="335" font-size="17.5" fill="#334155">间隔 GAP : W</text><text x="1320" y="335" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.23541</text><text x="1560" y="335" font-size="16" fill="#64748B">目标 0.236068｜误差 0.279%</text><text x="1030" y="362" font-size="17.5" fill="#334155">句点 DOT : W</text><text x="1320" y="362" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.14591</text><text x="1560" y="362" font-size="16" fill="#64748B">目标 0.145898｜误差 0.011%</text><text x="1030" y="389" font-size="17.5" fill="#334155">句点圆角 : DOT</text><text x="1320" y="389" font-size="17.5" font-family="'Cascadia Mono', Consolas, 'SF Mono', monospace" fill="#0F172A" font-weight="700">0.23613</text><text x="1560" y="389" font-size="16" fill="#64748B">目标 0.236068｜误差 0.028%</text><text x="1030" y="416" font-size="17.5" fill="#334155">字标