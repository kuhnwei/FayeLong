  --lemon-100:#FFF8DE;
  --lemon-200:#FFEFB4;
  --lemon-300:#FFE566;
  --lemon-400:#FFD93B;   /* 主色 · CTA / 强调 */
  --lemon-500:#EFC01A;
  --ink:#4A2B14;
  --ink-2:#6E4E35;
  --ink-3:#8A6A50;
  --peach:#F79E93;
  --peach-1:#FFE0DA;
  --leaf:#9FBE33;
  --leaf-1:#E2EDB4;
  --cream:#FFFBF0;
  --cream-2:#FFF4DC;
  --card:#FFFFFF;
  --r-lg:20px;
  --r-md:14px;
  --r-pill:999px;
  --bw:2px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font);color:var(--ink);line-height:1.7;
  background-color:var(--cream);
  background-image:radial-gradient(rgba(74,43,20,.06) 1.2px,transparent 1.2px);
  background-size:18px 18px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid rgba(74,43,20,.28);outline-offset:2px;border-radius:6px}

/* ---------- 布局 ---------- */
.login{
  display:grid;grid-template-columns:1.05fr .95fr;
  min-height:100dvh;
}
/* 左：品牌面 */
.brand-panel{
  position:relative;overflow:hidden;
  background:var(--lemon-100);
  border-right:var(--bw) solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:56px 48px;
}
.bp-blob{position:absolute;border-radius:50%;pointer-events:none}
.bp-blob.b1{width:420px;height:420px;left:-130px;top:-120px;background:var(--lemon-200);opacity:.85}
.bp-blob.b2{width:300px;height:300px;right:-90px;bottom:-80px;background:var(--leaf-1);opacity:.8}
.bp-blob.b3{width:120px;height:120px;right:70px;top:56px;background:var(--peach-1);opacity:.7}
.bp-inner{position:relative;max-width:430px;width:100%}

.bp-logo{
  width:120px;height:120px;display:block;margin-bottom:24px;
  background-image:var(--logo);background-repeat:no-repeat;
  background-size:contain;background-position:center;
  filter:drop-shadow(0 6px 0 rgba(74,43,20,.10));
  transform:rotate(-4deg);
}
.brand-panel h1{font-size:34px;font-weight:800;letter-spacing:.4px;line-height:1.2}
.bp-slogan{
  margin-top:12px;font-size:22px;font-weight:700;line-height:1.5;color:var(--ink);
}
.bp-slogan em{
  font-style:normal;
  background-image:linear-gradient(transparent 66%,var(--lemon-300) 66%);
  padding:0 .1em;
}
.feats{list-style:none;margin:30px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.feats li{display:flex;gap:12px;align-items:flex-start}
.fi{
  width:34px;height:34px;flex:none;border-radius:50%;
  border:var(--bw) solid var(--ink);display:grid;place-items:center;
  background:var(--card);
}
.feats b{display:block;font-size:13.5px;font-weight:700;line-height:1.5}
.feats span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.65}

/* 右：表单面 */
.form-panel{
  display:flex;align-items:center;justify-content:center;
  padding:48px 40px;position:relative;
}
.login-card{
  position:relative;width:100%;max-width:404px;
  background:var(--card);border:var(--bw) solid var(--ink);
  border-radius:26px;padding:32px 30px 28px;
  box-shadow:0 6px 0 rgba(74,43,20,.16);
}
.login-card h2{font-size:24px;font-weight:800;letter-spacing:.3px}
.login-card .hint{font-size:13px;color:var(--ink-3);margin-top:6px}
.peek{
  position:absolute;right:-14px;top:-30px;width:78px;height:78px;
  background-image:var(--logo);background-repeat:no-repeat;background-size:contain;
  transform:rotate(8deg);pointer-events:none;
  filter:drop-shadow(0 4px 0 rgba(74,43,20,.12));
}

.field{display:block;margin-top:20px}
.field>span{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.input-wrap{position:relative;display:flex;align-items:center}
.input{
  width:100%;height:50px;padding:0 16px;
  font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);
  background:#fff;border:var(--bw) solid rgba(74,43,20,.3);
  border-radius:var(--r-md);outline:0;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.input::placeholder{color:var(--ink-3);font-weight:400}
.input:hover{border-color:rgba(74,43,20,.5)}
.input:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(255,217,59,.5)}
.input-wrap .eye{
  position:absolute;right:8px;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;color:var(--ink-3);
}
.input-wrap .eye:hover{background:var(--lemon-100);color:var(--ink)}
.input-wrap:has(.eye) .input{padding-right:48px}

.row-between{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:16px;
}
.check{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.check input{position:absolute;opacity:0;width:0;height:0}
.check i{
  width:20px;height:20px;border-radius:7px;border:var(--bw) solid var(--ink);
  background:#fff;display:grid;place-items:center;flex:none;
}
.check input:checked + i{background:var(--lemon-400)}
.check input:checked + i::after{
  content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(-45deg) translate(1px,-1px);
}
.check input:focus-visible + i{outline:3px solid rgba(74,43,20,.28);outline-offset:2px}
.link{font-size:12.5px;font-weight:600;color:var(--ink-2);border-bottom:1.5px dashed rgba(74,43,20,.4);padding-bottom:1px}
.link:hover{color:var(--ink);border-bottom-color:var(--ink)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:50px;padding:0 24px;border-radius:var(--r-pill);
  border:var(--bw) solid var(--ink);font-size:15px;font-weight:700;
  transition:transform .12s,box-shadow .12s,background .15s;
}
.btn-primary{background:var(--lemon-400);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.btn-primary:hover{background:var(--lemon-300);transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn-primary:active{background:var(--lemon-500);transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn-block{width:100%;margin-top:22px}

.card-foot{
  margin-top:18px;padding-top:16px;border-top:1.5px dashed rgba(74,43,20,.22);
  font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.7;
}
.card-foot b{color:var(--ink-2);font-weight:700}
.env{
  position:absolute;right:44px;bottom:26px;
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);box-shadow:0 0 0 3px rgba(159,190,51,.22)}

/* ---------- 响应式 ---------- */
@media (max-width:900px){
  .login{grid-template-columns:1fr;min-height:100dvh}
  .brand-panel{
    border-right:0;border-bottom:var(--bw) solid var(--ink);
    padding:26px 22px 22px;align-items:flex-start;
  }
  .bp-logo{width:64px;height:64px;margin-bottom:10px}
  .brand-panel h1{font-size:22px}
  .bp-slogan{font-size:16px;margin-top:6px;line-height:1.45}
  .bp-blob.b1{width:260px;height:260px;left:-100px;top:-90px}
  .bp-blob.b2{width:190px;height:190px;right:-70px;bottom:-90px}
  .bp-blob.b3{width:76px;height:76px;right:44px;top:34px}
  .feats{display:none}
  .form-panel{padding:24px 18px 36px;align-items:center}
  .login-card{padding:26px 20px 22px;border-radius:22px;max-width:520px}
  .login-card h2{font-size:21px}
  .peek{width:62px;height:62px;right:-6px;top:-24px}
  .input{height:52px;font-size:16px}   /* iOS 不缩放 */
  .btn{height:52px}
  .env{position:static;margin-top:14px;justify-content:center;display:flex}
  .form-panel{flex-direction:column}
}
</style>
</head>
